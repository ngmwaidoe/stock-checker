<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock စစ်တဲ့ App</title>
<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Noto Sans Myanmar",sans-serif}
body{margin:0;background:#f1f5f9;color:#0f172a;padding-bottom:80px}
header{background:#16a34a;color:#fff;padding:20px 16px 24px;border-radius:0 0 20px 20px}
header h1{margin:0;font-size:22px} header p{margin:6px 0 0;opacity:.9;font-size:13px}
.wrap{max-width:900px;margin:-10px auto 0;padding:0 14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card b{font-size:22px;display:block;margin-top:4px}
.card span{font-size:13px;color:#64748b}
.red{color:#dc2626}.orange{color:#ea580c}.green{color:#16a34a}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
input,select{padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font-size:15px;width:100%;background:#fff}
.search{flex:1;min-width:180px}
.btn{background:#16a34a;color:#fff;border:0;padding:11px 16px;border-radius:10px;font-weight:700;cursor:pointer;font-size:15px}
.btn2{background:#0f172a}
.chips{display:flex;gap:8px;overflow:auto;padding:4px 0 10px}
.chip{white-space:nowrap;border:1px solid #cbd5e1;background:#fff;padding:7px 12px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.active{background:#16a34a;color:#fff;border-color:#16a34a}
.list{display:grid;gap:10px}
.item{background:#fff;border-radius:14px;padding:14px;display:flex;justify-content:space-between;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.item h3{margin:0;font-size:16px}.item p{margin:4px 0;color:#64748b;font-size:13px}
.badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:12px;font-weight:700}
.ok{background:#dcfce7;color:#166534}.warn{background:#ffedd5;color:#9a3412}.out{background:#fee2e2;color:#991b1b}
.qty{display:flex;align-items:center;gap:8px}
.qbtn{width:38px;height:38px;border-radius:50%;border:1px solid #cbd5e1;background:#f8fafc;font-size:20px;cursor:pointer}
.qnum{font-size:18px;font-weight:800;min-width:32px;text-align:center}
.small{font-size:12px;color:#64748b;background:none;border:0;cursor:pointer;text-decoration:underline;padding:4px}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);align-items:flex-end;justify-content:center;z-index:10}
.modal.open{display:flex}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:18px;max-height:90vh;overflow:auto}
.sheet h2{margin:0 0 12px}.sheet label{font-size:13px;color:#475569;display:block;margin:12px 0 5px}
.row{display:flex;gap:8px}
.alert{background:#fff3cd;border:1px solid #facc15;border-radius:12px;padding:12px;margin:10px 0;font-size:14px}
@media(min-width:600px){.cards{grid-template-columns:repeat(4,1fr)}.modal{align-items:center}.sheet{border-radius:16px}}
</style>
</head>
<body>
<header><h1>📦 Stock စစ်တဲ့ App</h1><p>ဆိုင်အတွက် ပစ္စည်းစာရင်း • မြန်မာကျပ်ဖြင့်</p></header>
<div class="wrap">
<div class="cards">
<div class="card"><span>စုစုပေါင်း အမျိုးအစား</span><b id="totalTypes">0</b></div>
<div class="card"><span>စုစုပေါင်း အရေအတွက်</span><b id="totalQty">0</b></div>
<div class="card"><span>ကုန်ခါနီး</span><b class="orange" id="lowCount">0</b></div>
<div class="card"><span>ကုန်သွားပြီ</span><b class="red" id="outCount">0</b></div>
</div>
<div id="alertBox"></div>
<div class="toolbar">
<input class="search" id="search" placeholder="🔍 ပစ္စည်းနာမည်နဲ့ ရှာပါ...">
<button class="btn" onclick="openModal()">+ ပစ္စည်းအသစ်ထည့်မယ်</button>
</div>
<div class="chips" id="chips"></div>
<div class="list" id="list"></div>
<p style="text-align:center;color:#94a3b8;font-size:12px;margin-top:20px">Data က ဒီဖုန်း / ကွန်ပျူတာထဲမှာပဲ သိမ်းထားပါတယ်<br><button onclick="localStorage.removeItem('stock_my');location.reload()" style="margin-top:8px;padding:6px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer">🔄 နမူနာ ပစ္စည်းတွေ ပြန်ခေါ်မယ်</button></p>
</div>

<div class="modal" id="modal"><div class="sheet">
<h2 id="modalTitle">ပစ္စည်းအသစ်ထည့်မယ်</h2>
<input type="hidden" id="editId">
<label>ပစ္စည်းအမည်</label><input id="fName" placeholder="ဥပမာ - ခေါက်ဆွဲခြောက်ထုပ်">
<label>အမျိုးအစား</label><select id="fCat"><option>အစားအသောက်</option><option>အလှကုန်</option><option>အိမ်သုံးပစ္စည်း</option><option>အဝတ်အထည်</option><option>အခြား</option></select>
<label>ဈေးနှုန်း (ကျပ်)</label><input id="fPrice" type="number" placeholder="1500">
<div class="row"><div style="flex:1"><label>အရေအတွက်</label><input id="fQty" type="number" value="10"></div><div style="flex:1"><label>ကုန်ခါနီး သတ်မှတ်ချက်</label><input id="fLow" type="number" value="5"></div></div>
<div class="row" style="margin-top:16px"><button class="btn" style="flex:1" onclick="save()">သိမ်းမယ်</button><button class="btn btn2" onclick="closeModal()">ပိတ်မယ်</button></div>
</div></div>

<script>
let _saved = JSON.parse(localStorage.getItem('stock_my')||'null');
let products = (Array.isArray(_saved) && _saved.length>0) ? _saved : [
{id:1,name:'ခေါက်ဆွဲခြောက်ထုပ်',cat:'အစားအသောက်',price:1500,qty:24,low:5},
{id:2,name:'ဆပ်ပြာ',cat:'အိမ်သုံးပစ္စည်း',price:2500,qty:3,low:5},
{id:3,name:'သွားတိုက်ဆေး',cat:'အလှကုန်',price:4500,qty:12,low:5},
{id:4,name:'ကော်ဖီမစ်',cat:'အစားအသောက်',price:5500,qty:0,low:5},
{id:5,name:'ငံပြာရည်',cat:'အစားအသောက်',price:3800,qty:18,low:5},
{id:6,name:'ဆီ (1 လီတာ)',cat:'အစားအသောက်',price:9500,qty:8,low:3},
{id:7,name:'ခေါင်းလျှော်ရည်',cat:'အလှကုန်',price:6800,qty:6,low:5},
{id:8,name:'ထမင်းပေါင်း',cat:'အစားအသောက်',price:1200,qty:30,low:10},
];
let filterCat='အားလုံး';
let cats=['အားလုံး','အစားအသောက်','အလှကုန်','အိမ်သုံးပစ္စည်း','အဝတ်အထည်','အခြား'];
function saveLS(){localStorage.setItem('stock_my',JSON.stringify(products))}
function status(p){if(p.qty===0) return ['ကုန်သွားပြီ','out']; if(p.qty<=p.low) return ['ကုန်ခါနီး','warn']; return ['လုံလောက်တယ်','ok']}
function render(){
 let q=document.getElementById('search').value.toLowerCase();
 document.getElementById('totalTypes').textContent=products.length;
 document.getElementById('totalQty').textContent=products.reduce((a,b)=>a+b.qty,0);
 document.getElementById('lowCount').textContent=products.filter(p=>p.qty>0&&p.qty<=p.low).length;
 document.getElementById('outCount').textContent=products.filter(p=>p.qty===0).length;
 let lows=products.filter(p=>p.qty<=p.low);
 document.getElementById('alertBox').innerHTML=lows.length?`<div class="alert">⚠️ ကုန်ခါနီးပစ္စည်း ${lows.length} မျိုး ရှိပါတယ်: ${lows.map(x=>x.name).join(', ')}</div>`:'';
 document.getElementById('chips').innerHTML=cats.map(c=>`<div class="chip ${c===filterCat?'active':''}" onclick="setCat('${c}')">${c}</div>`).join('');
 let list=products.filter(p=>(filterCat==='အားလုံး'||p.cat===filterCat)&&p.name.toLowerCase().includes(q));
 document.getElementById('list').innerHTML=list.length?list.map(p=>{let [t,cls]=status(p);return `<div class="item"><div><h3>${p.name}</h3><p>${p.cat} • ${p.price.toLocaleString()} ကျပ် • ကုန်ခါနီးသတ်မှတ်ချက်: ${p.low}</p><span class="badge ${cls}">${t}</span><div><button class="small" onclick="edit(${p.id})">ပြင်မယ်</button><button class="small" style="color:#dc2626" onclick="del(${p.id})">ဖျက်မယ်</button></div></div><div class="qty"><button class="qbtn" onclick="change(${p.id},-1)">−</button><div class="qnum">${p.qty}</div><button class="qbtn" onclick="change(${p.id},1)">+</button></div></div>`}).join(''):'<p style="text-align:center;padding:20px;background:#fff;border-radius:12px">ပစ္စည်း မတွေ့ပါ</p>';
 saveLS();
}
function setCat(c){filterCat=c;render()}
function change(id,d){let p=products.find(x=>x.id===id);p.qty=Math.max(0,p.qty+d);render()}
function del(id){if(confirm('ဖျက်မှာ သေချာလား?')){products=products.filter(x=>x.id!==id);render()}}
function openModal(){document.getElementById('modalTitle').textContent='ပစ္စည်းအသစ်ထည့်မယ်';document.getElementById('editId').value='';['fName','fPrice'].forEach(i=>document.getElementById(i).value='');document.getElementById('fQty').value=10;document.getElementById('fLow').value=5;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function edit(id){let p=products.find(x=>x.id===id);document.getElementById('modalTitle').textContent='ပစ္စည်းပြင်မယ်';document.getElementById('editId').value=id;document.getElementById('fName').value=p.name;document.getElementById('fCat').value=p.cat;document.getElementById('fPrice').value=p.price;document.getElementById('fQty').value=p.qty;document.getElementById('fLow').value=p.low;document.getElementById('modal').classList.add('open')}
function save(){let name=document.getElementById('fName').value.trim();if(!name){alert('နာမည်ထည့်ပါ');return}let id=document.getElementById('editId').value;let data={name,cat:document.getElementById('fCat').value,price:Number(document.getElementById('fPrice').value)||0,qty:Number(document.getElementById('fQty').value)||0,low:Number(document.getElementById('fLow').value)||5};if(id){let p=products.find(x=>x.id==id);Object.assign(p,data)}else{data.id=Date.now();products.unshift(data)}closeModal();render()}
document.getElementById('search').addEventListener('input',render);
render();
</script>
</body>
</html>
